<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>申し込み管理システム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      doc,
      addDoc,
      deleteDoc,
      onSnapshot,
      query,
      orderBy,
      writeBatch
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD-moushikomi59749-demo",
      authDomain: "moushikomi-59749.firebaseapp.com",
      projectId: "moushikomi-59749",
      storageBucket: "moushikomi-59749.appspot.com",
      messagingSenderId: "000000000000",
      appId: "1:000000000000:web:moushikomi59749"
    };

    const ADMIN_PASSCODE = "admin1234"; // 必要に応じて変更してください

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const state = {
      events: [],
      submissions: [],
      isAuthenticated: false,
      activeView: "folders", // "folders" | "list" | "formCheck"
      selectedFolderId: "",
      isFilterPanelOpen: false,
      sortBy: "createdAt_desc",
      selectedGrades: new Set(),
      selectedGenders: new Set(),
      selectedCategories: new Set()
    };

    function showToast(message, type = "info") {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      const bg =
        type === "error"
          ? "bg-red-600 text-white"
          : type === "success"
          ? "bg-emerald-600 text-white"
          : "bg-slate-800 text-white";
      toast.className = `${bg} px-4 py-2.5 rounded-xl shadow-lg text-xs sm:text-sm font-medium transition-opacity duration-300`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        setTimeout(() => toast.remove(), 300);
      }, 2800);
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function toEpoch(ts) {
      if (!ts) return 0;
      if (typeof ts === "number") return ts;
      const d = new Date(ts);
      return isNaN(d.getTime()) ? 0 : d.getTime();
    }

    function formatDateTime(ts) {
      const ms = toEpoch(ts);
      if (!ms) return "";
      const d = new Date(ms);
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function escapeCsv(val) {
      const s = val === null || val === undefined ? "" : String(val);
      return `"${s.replace(/"/g, '""')}"`;
    }

    function getFormUrl() {
      const base = `${window.location.origin}${window.location.pathname}`;
      return state.selectedFolderId
        ? `${base}?eventId=${encodeURIComponent(state.selectedFolderId)}`
        : base;
    }

    function getFolderItems() {
      if (!state.selectedFolderId) return [];
      return state.submissions.filter((item) => item.eventId === state.selectedFolderId);
    }

    function renderFoldersView() {
      const listEl = document.getElementById("foldersListBox");
      if (!listEl) return;

      if (state.events.length === 0) {
        listEl.innerHTML = `<p class="text-sm text-slate-500 py-2">フォルダがありません。</p>`;
        return;
      }

      listEl.innerHTML = state.events
        .map((ev) => {
          const count = state.submissions.filter((s) => s.eventId === ev.id).length;
          return `
            <div class="flex items-center justify-between gap-2 p-3 rounded-xl bg-slate-50 border border-slate-200 hover:border-blue-300 transition">
              <button
                type="button"
                data-open-folder="${escapeHtml(ev.id)}"
                class="flex-1 text-left flex items-center justify-between gap-2 py-1"
              >
                <span class="font-semibold text-sm text-slate-900">${escapeHtml(ev.name || "")}</span>
                <span class="text-xs px-2.5 py-1 rounded-full bg-white border border-slate-200 text-slate-700 font-medium whitespace-nowrap">
                  ${count}件
                </span>
              </button>
              <button
                type="button"
                data-delete-folder="${escapeHtml(ev.id)}"
                class="px-2.5 py-1.5 text-xs font-medium text-red-600 hover:bg-red-50 rounded-lg border border-red-200"
              >
                削除
              </button>
            </div>
          `;
        })
        .join("");

      // フォルダを押したら自動的に一覧を表示
      listEl.querySelectorAll("[data-open-folder]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.selectedFolderId = btn.getAttribute("data-open-folder");
          state.selectedGrades.clear();
          state.selectedGenders.clear();
          state.selectedCategories.clear();
          switchView("list");
        });
      });

      listEl.querySelectorAll("[data-delete-folder]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-delete-folder");
          const ev = state.events.find((x) => x.id === id);
          if (!confirm(`「${ev?.name || id}」を削除しますか？`)) return;
          try {
            await deleteDoc(doc(db, "events", id));
            if (state.selectedFolderId === id) state.selectedFolderId = "";
            showToast("フォルダを削除しました", "success");
          } catch (err) {
            console.error(err);
            showToast("削除に失敗しました", "error");
          }
        });
      });
    }

    function renderCheckGroups() {
      const gradeEl = document.getElementById("gradeChecks");
      const genderEl = document.getElementById("genderChecks");
      const categoryEl = document.getElementById("categoryChecks");
      if (!gradeEl || !genderEl || !categoryEl) return;

      const items = getFolderItems();
      const grades = Array.from(new Set(items.map((x) => (x.grade || "").trim()).filter(Boolean)));
      const genders = Array.from(new Set(items.map((x) => (x.gender || "").trim()).filter(Boolean)));
      const categories = Array.from(new Set(items.map((x) => (x.category || "").trim()).filter(Boolean)));

      Array.from(state.selectedGrades).forEach((v) => {
        if (!grades.includes(v)) state.selectedGrades.delete(v);
      });
      Array.from(state.selectedGenders).forEach((v) => {
        if (!genders.includes(v)) state.selectedGenders.delete(v);
      });
      Array.from(state.selectedCategories).forEach((v) => {
        if (!categories.includes(v)) state.selectedCategories.delete(v);
      });

      const buildChips = (list, setObj, attrName, emptyText) => {
        if (list.length === 0) return `<span class="text-xs text-slate-400">${emptyText}</span>`;
        return list
          .map((val) => {
            const checked = setObj.has(val) ? "checked" : "";
            return `
              <label class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-50 border border-slate-200 text-xs font-medium text-slate-700 cursor-pointer">
                <input type="checkbox" ${attrName}="${escapeHtml(val)}" ${checked} class="rounded border-slate-300 text-blue-600" />
                <span>${escapeHtml(val)}</span>
              </label>
            `;
          })
          .join("");
      };

      gradeEl.innerHTML = buildChips(grades, state.selectedGrades, "data-chk-grade", "なし");
      genderEl.innerHTML = buildChips(genders, state.selectedGenders, "data-chk-gender", "なし");
      categoryEl.innerHTML = buildChips(categories, state.selectedCategories, "data-chk-category", "なし");

      gradeEl.querySelectorAll("[data-chk-grade]").forEach((el) => {
        el.addEventListener("change", () => {
          const v = el.getAttribute("data-chk-grade");
          el.checked ? state.selectedGrades.add(v) : state.selectedGrades.delete(v);
          renderListRows();
        });
      });

      genderEl.querySelectorAll("[data-chk-gender]").forEach((el) => {
        el.addEventListener("change", () => {
          const v = el.getAttribute("data-chk-gender");
          el.checked ? state.selectedGenders.add(v) : state.selectedGenders.delete(v);
          renderListRows();
        });
      });

      categoryEl.querySelectorAll("[data-chk-category]").forEach((el) => {
        el.addEventListener("change", () => {
          const v = el.getAttribute("data-chk-category");
          el.checked ? state.selectedCategories.add(v) : state.selectedCategories.delete(v);
          renderListRows();
        });
      });
    }

    function getFilteredAndSortedItems() {
      const items = getFolderItems().filter((item) => {
        const g = (item.grade || "").trim();
        const sex = (item.gender || "").trim();
        const cat = (item.category || "").trim();

        if (state.selectedGrades.size > 0 && !state.selectedGrades.has(g)) return false;
        if (state.selectedGenders.size > 0 && !state.selectedGenders.has(sex)) return false;
        if (state.selectedCategories.size > 0 && !state.selectedCategories.has(cat)) return false;
        return true;
      });

      return items.sort((a, b) => {
        switch (state.sortBy) {
          case "createdAt_asc":
            return toEpoch(a.createdAt) - toEpoch(b.createdAt);
          case "name_asc":
            return String(a.name || "").localeCompare(String(b.name || ""), "ja");
          case "grade_asc":
            return String(a.grade || "").localeCompare(String(b.grade || ""), "ja");
          case "createdAt_desc":
          default:
            return toEpoch(b.createdAt) - toEpoch(a.createdAt);
        }
      });
    }

    function renderListRows() {
      const folder = state.events.find((e) => e.id === state.selectedFolderId);
      const titleEl = document.getElementById("listFolderName");
      const countEl = document.getElementById("listCountBadge");
      const tbody = document.getElementById("listTableBody");

      if (titleEl) titleEl.textContent = folder ? folder.name : "フォルダ未選択";

      const rows = getFilteredAndSortedItems();
      if (countEl) countEl.textContent = `${rows.length}件`;

      if (!tbody) return;
      if (rows.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="10" class="px-3 py-6 text-center text-xs sm:text-sm text-slate-500">
              該当データがありません。
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = rows
        .map((item, i) => `
          <tr class="border-b border-slate-100 hover:bg-slate-50 text-xs sm:text-sm">
            <td class="px-3 py-2 text-slate-500 whitespace-nowrap">${i + 1}</td>
            <td class="px-3 py-2 font-semibold text-slate-900 whitespace-nowrap">${escapeHtml(item.name || "")}</td>
            <td class="px-3 py-2 text-slate-600 whitespace-nowrap">${escapeHtml(item.kana || "")}</td>
            <td class="px-3 py-2 text-slate-700 whitespace-nowrap">${escapeHtml(item.grade || "")}</td>
            <td class="px-3 py-2 text-slate-700 whitespace-nowrap">${escapeHtml(item.gender || "")}</td>
            <td class="px-3 py-2 text-slate-700 whitespace-nowrap">${escapeHtml(item.category || "")}</td>
            <td class="px-3 py-2 text-slate-700 whitespace-nowrap">${escapeHtml(item.phone || "")}</td>
            <td class="px-3 py-2 text-slate-700 min-w-[160px]">${escapeHtml(item.address || "")}</td>
            <td class="px-3 py-2 text-slate-500 whitespace-nowrap">${escapeHtml(formatDateTime(item.createdAt))}</td>
            <td class="px-3 py-2 whitespace-nowrap">
              <button
                type="button"
                data-del-item="${escapeHtml(item.id)}"
                class="px-2 py-1 text-xs text-red-600 hover:bg-red-50 rounded border border-red-200"
              >
                削除
              </button>
            </td>
          </tr>
        `)
        .join("");

      tbody.querySelectorAll("[data-del-item]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-del-item");
          if (!confirm("削除しますか？")) return;
          try {
            await deleteDoc(doc(db, "submissions", id));
            showToast("削除しました", "success");
          } catch (err) {
            console.error(err);
            showToast("削除に失敗しました", "error");
          }
        });
      });
    }

    function renderFormCheckView() {
      const folder = state.events.find((e) => e.id === state.selectedFolderId);
      const label = document.getElementById("formCheckFolderBadge");
      const urlInput = document.getElementById("formCheckUrlInput");
      const qrBox = document.getElementById("formCheckQrBox");

      if (label) {
        label.textContent = folder ? `対象フォルダ：${folder.name}` : "対象フォルダ：未選択";
      }

      const url = getFormUrl();
      if (urlInput) urlInput.value = url;

      if (qrBox) {
        qrBox.innerHTML = "";
        if (typeof QRCode !== "undefined") {
          new QRCode(qrBox, {
            text: url,
            width: 164,
            height: 164,
            correctLevel: QRCode.CorrectLevel.M
          });
        }
      }
    }

    function switchView(view) {
      state.activeView = view;

      const vFolders = document.getElementById("viewFolders");
      const vList = document.getElementById("viewList");
      const vFormCheck = document.getElementById("viewFormCheck");

      const bFolders = document.getElementById("navFoldersBtn");
      const bFormCheck = document.getElementById("navFormCheckBtn");

      vFolders.classList.add("hidden");
      vList.classList.add("hidden");
      vFormCheck.classList.add("hidden");

      const offStyle = "px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200";
      const onStyle = "px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-blue-600 text-white";

      bFolders.className = view === "folders" ? onStyle : offStyle;
      bFormCheck.className = view === "formCheck" ? onStyle : offStyle;

      if (view === "folders") {
        vFolders.classList.remove("hidden");
        renderFoldersView();
      } else if (view === "list") {
        vList.classList.remove("hidden");
        renderCheckGroups();
        renderListRows();
      } else if (view === "formCheck") {
        vFormCheck.classList.remove("hidden");
        renderFormCheckView();
      }
    }

    function applyGate() {
      const gate = document.getElementById("gateSection");
      const appBody = document.getElementById("appSection");
      if (state.isAuthenticated) {
        gate.classList.add("hidden");
        appBody.classList.remove("hidden");
        switchView(state.activeView || "folders");
      } else {
        gate.classList.remove("hidden");
        appBody.classList.add("hidden");
      }
    }

    function exportJson() {
      const payload = {
        appName: "moushikomi-kanri",
        projectId: firebaseConfig.projectId,
        exportedAt: new Date().toISOString(),
        events: state.events,
        submissions: state.submissions
      };
      const now = new Date();
      const p = (n) => String(n).padStart(2, "0");
      const name = `申し込みバックアップ_${now.getFullYear()}${p(now.getMonth() + 1)}${p(now.getDate())}_${p(now.getHours())}${p(now.getMinutes())}.json`;
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = name;
      a.click();
      URL.revokeObjectURL(url);
      showToast("JSONを保存しました", "success");
    }

    async function restoreJson(file) {
      const parsed = JSON.parse(await file.text());
      const eventsList = Array.isArray(parsed.events) ? parsed.events : [];
      const subsList = Array.isArray(parsed.submissions) ? parsed.submissions : [];
      if (!confirm(`復元しますか？\nフォルダ: ${eventsList.length}件 / 申込: ${subsList.length}件`)) return;

      const ops = [];
      eventsList.forEach((ev) => {
        if (ev?.id) {
          const { id, ...rest } = ev;
          ops.push({ col: "events", id: String(id), data: rest });
        }
      });
      subsList.forEach((sub) => {
        if (sub?.id) {
          const { id, ...rest } = sub;
          ops.push({ col: "submissions", id: String(id), data: rest });
        }
      });

      for (let i = 0; i < ops.length; i += 400) {
        const batch = writeBatch(db);
        ops.slice(i, i + 400).forEach((op) => {
          batch.set(doc(db, op.col, op.id), op.data, { merge: true });
        });
        await batch.commit();
      }
      showToast("復元しました", "success");
    }

    function exportCsv() {
      const folder = state.events.find((e) => e.id === state.selectedFolderId);
      const rows = getFilteredAndSortedItems();
      const headers = ["No", "フォルダ", "氏名", "フリガナ", "学年", "性別", "種目", "連絡先", "住所", "申込日時"];
      const lines = rows.map((item, i) => [
        i + 1,
        folder?.name || "",
        item.name || "",
        item.kana || "",
        item.grade || "",
        item.gender || "",
        item.category || "",
        item.phone || "",
        item.address || "",
        formatDateTime(item.createdAt)
      ].map(escapeCsv).join(","));

      const csv = "\uFEFF" + [headers.map(escapeCsv).join(","), ...lines].join("\r\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${folder?.name || "一覧"}_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("CSVを出力しました", "success");
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("gateForm").addEventListener("submit", (e) => {
        e.preventDefault();
        if (document.getElementById("gatePassInput").value === ADMIN_PASSCODE) {
          state.isAuthenticated = true;
          state.activeView = "folders";
          document.getElementById("gatePassInput").value = "";
          applyGate();
        } else {
          showToast("パスワードが違います", "error");
        }
      });

      document.getElementById("lockBtn").addEventListener("click", () => {
        state.isAuthenticated = false;
        applyGate();
      });

      document.getElementById("navFoldersBtn").addEventListener("click", () => switchView("folders"));
      document.getElementById("navFormCheckBtn").addEventListener("click", () => switchView("formCheck"));
      document.getElementById("backToFoldersBtn").addEventListener("click", () => switchView("folders"));

      // 並び替え・条件指定ボタンの開閉
      document.getElementById("toggleFilterBtn").addEventListener("click", () => {
        state.isFilterPanelOpen = !state.isFilterPanelOpen;
        const panel = document.getElementById("filterPanel");
        panel.classList.toggle("hidden", !state.isFilterPanelOpen);
      });

      document.getElementById("sortSelect").addEventListener("change", (e) => {
        state.sortBy = e.target.value;
        renderListRows();
      });

      document.getElementById("resetFilterBtn").addEventListener("click", () => {
        state.sortBy = "createdAt_desc";
        document.getElementById("sortSelect").value = "createdAt_desc";
        state.selectedGrades.clear();
        state.selectedGenders.clear();
        state.selectedCategories.clear();
        renderCheckGroups();
        renderListRows();
      });

      // フォルダ作成
      document.getElementById("createFolderForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const input = document.getElementById("newFolderInput");
        const name = input.value.trim();
        if (!name) return;
        try {
          await addDoc(collection(db, "events"), { name, createdAt: Date.now() });
          input.value = "";
          showToast("フォルダを作成しました", "success");
        } catch (err) {
          console.error(err);
          showToast("作成に失敗しました", "error");
        }
      });

      // URLコピー
      document.getElementById("copyUrlBtn").addEventListener("click", async () => {
        const val = document.getElementById("formCheckUrlInput").value;
        try {
          await navigator.clipboard.writeText(val);
          showToast("URLをコピーしました", "success");
        } catch {
          const inp = document.getElementById("formCheckUrlInput");
          inp.select();
          document.execCommand("copy");
          showToast("URLをコピーしました", "success");
        }
      });

      // 手動入力保存
      document.getElementById("manualSaveForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!state.selectedFolderId) {
          showToast("先にフォルダを選択してください", "error");
          return;
        }
        const folder = state.events.find((x) => x.id === state.selectedFolderId);
        const btn = document.getElementById("manualSubmitBtn");
        btn.disabled = true;
        try {
          await addDoc(collection(db, "submissions"), {
            eventId: state.selectedFolderId,
            eventName: folder?.name || "",
            name: document.getElementById("mName").value.trim(),
            kana: document.getElementById("mKana").value.trim(),
            grade: document.getElementById("mGrade").value.trim(),
            gender: document.getElementById("mGender").value,
            category: document.getElementById("mCategory").value.trim(),
            phone: document.getElementById("mPhone").value.trim(),
            address: document.getElementById("mAddress").value.trim(),
            createdAt: Date.now(),
            source: "manual"
          });
          e.target.reset();
          showToast("保存しました", "success");
        } catch (err) {
          console.error(err);
          showToast("保存に失敗しました", "error");
        } finally {
          btn.disabled = false;
        }
      });

      document.getElementById("exportJsonBtn").addEventListener("click", exportJson);
      document.getElementById("exportCsvBtn").addEventListener("click", exportCsv);

      const fileInput = document.getElementById("restoreJsonFile");
      document.getElementById("restoreJsonBtn").addEventListener("click", () => {
        fileInput.value = "";
        fileInput.click();
      });
      fileInput.addEventListener("change", async (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        try {
          await restoreJson(f);
        } catch (err) {
          console.error(err);
          showToast("復元に失敗しました", "error");
        }
      });

      onSnapshot(query(collection(db, "events"), orderBy("createdAt", "desc")), (snap) => {
        state.events = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        if (state.isAuthenticated) {
          renderFoldersView();
          renderListRows();
          renderFormCheckView();
        }
      });

      onSnapshot(query(collection(db, "submissions"), orderBy("createdAt", "desc")), (snap) => {
        state.submissions = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        if (state.isAuthenticated) {
          renderFoldersView();
          renderCheckGroups();
          renderListRows();
        }
      });

      applyGate();
    });
  </script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

  <!-- パスワード入力画面 -->
  <section id="gateSection" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
      <h1 class="text-lg font-bold text-center text-slate-900">パスワード入力</h1>
      <form id="gateForm" class="space-y-3">
        <input
          id="gatePassInput"
          type="password"
          required
          autofocus
          placeholder="パスワード"
          class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <button
          type="submit"
          class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold"
        >
          開く
        </button>
      </form>
    </div>
  </section>

  <!-- 管理画面本体 -->
  <div id="appSection" class="hidden min-h-screen flex flex-col">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
      <div class="max-w-5xl mx-auto px-4 py-2.5 flex items-center justify-between gap-2">
        <h1 class="text-base sm:text-lg font-bold text-slate-900">申し込み管理</h1>
        <div class="flex items-center gap-1.5 sm:gap-2">
          <button
            id="navFoldersBtn"
            type="button"
            class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-blue-600 text-white"
          >
            フォルダ
          </button>
          <button
            id="navFormCheckBtn"
            type="button"
            class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200"
          >
            入力フォームの確認
          </button>
          <button
            id="lockBtn"
            type="button"
            class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-slate-800 text-white"
          >
            ロック
          </button>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-5 space-y-5">
      <!-- 1. フォルダ画面（押すと自動で一覧表示） -->
      <section id="viewFolders" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5 space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h2 class="text-base font-bold text-slate-900">フォルダ</h2>
          <div class="flex items-center gap-1.5">
            <button
              id="exportJsonBtn"
              type="button"
              class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 text-white"
            >
              JSON保存
            </button>
            <button
              id="restoreJsonBtn"
              type="button"
              class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-amber-600 text-white"
            >
              JSON復元
            </button>
            <input id="restoreJsonFile" type="file" accept=".json,application/json" class="hidden" />
          </div>
        </div>

        <form id="createFolderForm" class="flex gap-2">
          <input
            id="newFolderInput"
            type="text"
            required
            placeholder="新しいフォルダ名"
            class="flex-1 rounded-xl border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <button
            type="submit"
            class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold whitespace-nowrap"
          >
            作成
          </button>
        </form>

        <div id="foldersListBox" class="space-y-2"></div>
      </section>

      <!-- 2. 申込者一覧画面（フォルダ選択で自動表示・「並び替え・条件指定」ボタン） -->
      <section id="viewList" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5 space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <button
              id="backToFoldersBtn"
              type="button"
              class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700"
            >
              ← フォルダ
            </button>
            <h2 id="listFolderName" class="text-base font-bold text-slate-900">一覧</h2>
            <span id="listCountBadge" class="text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 font-semibold">
              0件
            </span>
          </div>

          <div class="flex items-center gap-1.5">
            <button
              id="toggleFilterBtn"
              type="button"
              class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-900 text-white"
            >
              並び替え・条件指定
            </button>
            <button
              id="exportCsvBtn"
              type="button"
              class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white"
            >
              CSV
            </button>
          </div>
        </div>

        <!-- 並び替え・条件指定パネル（ボタン押下で開閉） -->
        <div id="filterPanel" class="hidden p-3.5 rounded-xl bg-slate-50 border border-slate-200 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <label for="sortSelect" class="text-xs font-bold text-slate-700">並び替え</label>
              <select
                id="sortSelect"
                class="rounded-lg border border-slate-300 bg-white px-2.5 py-1 text-xs text-slate-800"
              >
                <option value="createdAt_desc">申込日時（新しい順）</option>
                <option value="createdAt_asc">申込日時（古い順）</option>
                <option value="name_asc">氏名（あいうえお順）</option>
                <option value="grade_asc">学年順</option>
              </select>
            </div>
            <button
              id="resetFilterBtn"
              type="button"
              class="text-xs font-semibold text-blue-600 hover:underline"
            >
              解除
            </button>
          </div>

          <div class="space-y-1.5">
            <div class="text-xs font-semibold text-slate-600">学年</div>
            <div id="gradeChecks" class="flex flex-wrap gap-1.5"></div>
          </div>

          <div class="space-y-1.5">
            <div class="text-xs font-semibold text-slate-600">性別</div>
            <div id="genderChecks" class="flex flex-wrap gap-1.5"></div>
          </div>

          <div class="space-y-1.5">
            <div class="text-xs font-semibold text-slate-600">種目</div>
            <div id="categoryChecks" class="flex flex-wrap gap-1.5"></div>
          </div>
        </div>

        <div class="overflow-x-auto border border-slate-200 rounded-xl">
          <table class="w-full text-left border-collapse">
            <thead class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-600">
              <tr>
                <th class="px-3 py-2 whitespace-nowrap">No</th>
                <th class="px-3 py-2 whitespace-nowrap">氏名</th>
                <th class="px-3 py-2 whitespace-nowrap">フリガナ</th>
                <th class="px-3 py-2 whitespace-nowrap">学年</th>
                <th class="px-3 py-2 whitespace-nowrap">性別</th>
                <th class="px-3 py-2 whitespace-nowrap">種目</th>
                <th class="px-3 py-2 whitespace-nowrap">連絡先</th>
                <th class="px-3 py-2 whitespace-nowrap">住所</th>
                <th class="px-3 py-2 whitespace-nowrap">申込日時</th>
                <th class="px-3 py-2 whitespace-nowrap">操作</th>
              </tr>
            </thead>
            <tbody id="listTableBody"></tbody>
          </table>
        </div>
      </section>

      <!-- 3. 入力フォームの確認（QR・URL表示＋手動入力保存） -->
      <section id="viewFormCheck" class="hidden space-y-4">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5 space-y-4">
          <div class="flex items-center justify-between gap-2">
            <h2 class="text-base font-bold text-slate-900">入力フォームの確認</h2>
            <span id="formCheckFolderBadge" class="text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-700 font-medium">
              対象フォルダ：未選択
            </span>
          </div>

          <div class="flex flex-col sm:flex-row items-center gap-4">
            <div id="formCheckQrBox" class="p-2.5 bg-white rounded-xl border border-slate-200"></div>
            <div class="w-full flex-1 flex gap-2">
              <input
                id="formCheckUrlInput"
                type="text"
                readonly
                class="flex-1 rounded-xl border border-slate-300 bg-slate-50 px-3 py-2 text-xs sm:text-sm"
              />
              <button
                id="copyUrlBtn"
                type="button"
                class="px-3.5 py-2 rounded-xl bg-slate-800 text-white text-xs font-semibold whitespace-nowrap"
              >
                コピー
              </button>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5 space-y-3">
          <h3 class="text-base font-bold text-slate-900">手動入力</h3>
          <form id="manualSaveForm" class="space-y-3">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <input id="mName" type="text" required placeholder="氏名 *" class="rounded-xl border border-slate-300 px-3 py-2 text-sm" />
              <input id="mKana" type="text" required placeholder="フリガナ *" class="rounded-xl border border-slate-300 px-3 py-2 text-sm" />
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <input id="mGrade" type="text" placeholder="学年" class="rounded-xl border border-slate-300 px-3 py-2 text-sm" />
              <select id="mGender" class="rounded-xl border border-slate-300 px-3 py-2 text-sm bg-white">
                <option value="">性別</option>
                <option value="男性">男性</option>
                <option value="女性">女性</option>
                <option value="その他">その他</option>
              </select>
              <input id="mCategory" type="text" placeholder="種目" class="rounded-xl border border-slate-300 px-3 py-2 text-sm" />
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <input id="mPhone" type="tel" required placeholder="連絡先 *" class="rounded-xl border border-slate-300 px-3 py-2 text-sm" />
              <input id="mAddress" type="text" required placeholder="住所 *" class="rounded-xl border border-slate-300 px-3 py-2 text-sm" />
            </div>
            <button
              id="manualSubmitBtn"
              type="submit"
              class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold"
            >
              保存
            </button>
          </form>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
